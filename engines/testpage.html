<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTS test page</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #14161a; --card: #1e2128; --fg: #e8eaed; --dim: #9aa0a6;
    --accent: #7cb7ff; --err: #ff8a80; --border: #33373f;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f8; --card: #fff; --fg: #1a1c1f; --dim: #5f6368;
            --accent: #1a63c9; --err: #b3261e; --border: #d5d8dd; }
  }
  * { box-sizing: border-box; }
  body { margin: 0 auto; padding: 12px; max-width: 640px;
         background: var(--bg); color: var(--fg);
         font: 15px/1.45 system-ui, sans-serif; }
  header { margin-bottom: 12px; }
  h1 { font-size: 1.15rem; margin: 0; }
  #engine-info { color: var(--dim); font-size: 0.85rem; overflow-wrap: anywhere; }
  textarea { width: 100%; min-height: 4.5em; padding: 8px; resize: vertical;
             background: var(--card); color: var(--fg);
             border: 1px solid var(--border); border-radius: 8px; font: inherit; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
  select, button { padding: 7px 12px; border-radius: 8px; font: inherit;
                   background: var(--card); color: var(--fg);
                   border: 1px solid var(--border); }
  button { cursor: pointer; font-weight: 600; }
  button.primary { background: var(--accent); border-color: var(--accent);
                   color: var(--bg); }
  button:disabled { opacity: 0.5; cursor: wait; }
  #status { color: var(--dim); font-size: 0.85rem; min-height: 1.2em; margin-top: 6px; }
  .entry { background: var(--card); border: 1px solid var(--border);
           border-radius: 10px; padding: 10px; margin-top: 10px; }
  .entry .text { font-size: 0.9rem; overflow-wrap: anywhere; }
  .entry .meta { color: var(--dim); font-size: 0.8rem; margin: 4px 0; }
  .entry .nums { font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .entry .nums b { color: var(--accent); }
  .entry .error { color: var(--err); font-size: 0.85rem; overflow-wrap: anywhere; }
  .entry audio { width: 100%; height: 36px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1 id="engine-name">TTS test page</h1>
  <div id="engine-info">connecting to /health…</div>
</header>

<textarea id="text">The quick brown fox jumps over the lazy dog. It barked back, quite offended. Nobody expected that.</textarea>
<div class="row">
  <select id="lang">
    <option value="en">en</option>
    <option value="pt">pt</option>
  </select>
  <select id="voice"><option value="">voice: default</option></select>
  <button id="speak" class="primary">Speak</button>
  <button id="stream">Stream</button>
</div>
<div id="status"></div>

<div id="history"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);

// ── header: who are we talking to ──────────────────────────────────────────
async function loadHealth() {
  try {
    const r = await fetch('/health');
    const h = await r.json();
    if (!r.ok) throw new Error(h.detail || h.status || r.status);
    const name = h.engine || (h.models_loaded || []).join(', ') || 'unknown engine';
    $('engine-name').textContent = name + ' @ ' + location.host;
    document.title = name + ' — TTS test';
    $('engine-info').textContent = 'models_loaded: ' + JSON.stringify(h.models_loaded);
  } catch (e) {
    $('engine-info').textContent = 'engine not ready (' + e.message + ') — retrying…';
    setTimeout(loadHealth, 3000);
  }
}

async function loadVoices() {
  try {
    const r = await fetch('/voices');
    const v = (await r.json()).voices || [];
    if (!v.length) { $('voice').hidden = true; return; }
    for (const name of v) {
      const o = document.createElement('option');
      o.value = o.textContent = name;
      $('voice').appendChild(o);
    }
  } catch (e) { $('voice').hidden = true; }
}

// ── helpers ────────────────────────────────────────────────────────────────
function reqBody() {
  return JSON.stringify({
    text: $('text').value,
    lang: $('lang').value,
    voice: $('voice').value || null,
  });
}

function audioDuration(blob) {   // seconds, via a throwaway <audio>
  return new Promise(resolve => {
    const a = new Audio(URL.createObjectURL(blob));
    a.onloadedmetadata = () => { URL.revokeObjectURL(a.src); resolve(a.duration); };
    a.onerror = () => resolve(NaN);
  });
}

function addEntry({ mode, error, nums, blobs }) {
  const e = document.createElement('div');
  e.className = 'entry';
  const meta = `${mode} · ${$('lang').value}` +
    ($('voice').value ? ` · ${$('voice').value}` : '') +
    ` · ${new Date().toLocaleTimeString()}`;
  e.innerHTML = `<div class="text"></div><div class="meta"></div>` +
    (error ? `<div class="error"></div>` : `<div class="nums"></div>`);
  e.querySelector('.text').textContent = $('text').value;
  e.querySelector('.meta').textContent = meta;
  if (error) e.querySelector('.error').textContent = error;
  else e.querySelector('.nums').innerHTML = nums;
  for (const b of blobs || []) {
    const a = document.createElement('audio');
    a.controls = true;
    a.src = URL.createObjectURL(b);
    e.appendChild(a);
  }
  $('history').prepend(e);
  return e;
}

async function errorText(resp) {  // "400: this engine does not speak pt" etc.
  let msg = await resp.text();
  try { msg = JSON.parse(msg).detail || msg; } catch (_) {}
  return `HTTP ${resp.status}: ${msg}`;
}

let ticker;
function busy(on, label) {
  $('speak').disabled = $('stream').disabled = on;
  clearInterval(ticker);
  if (on) {
    const t0 = performance.now();
    $('status').textContent = label;
    ticker = setInterval(() => {
      $('status').textContent = `${label} ${((performance.now() - t0) / 1000).toFixed(1)}s`;
    }, 100);
  } else $('status').textContent = '';
}

// ── Speak: POST /tts, one WAV back ─────────────────────────────────────────
$('speak').onclick = async () => {
  busy(true, 'synthesizing…');
  const t0 = performance.now();
  try {
    const r = await fetch('/tts', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: reqBody() });
    if (!r.ok) { addEntry({ mode: 'speak', error: await errorText(r) }); return; }
    const blob = await r.blob();
    const reqS = (performance.now() - t0) / 1000;
    const audioS = await audioDuration(blob);
    addEntry({ mode: 'speak', blobs: [blob], nums:
      `request <b>${reqS.toFixed(2)}s</b> · audio <b>${audioS.toFixed(2)}s</b>` +
      ` · <b>${(audioS / reqS).toFixed(2)}×</b> realtime` });
  } catch (e) {
    addEntry({ mode: 'speak', error: String(e) });
  } finally { busy(false); }
};

// ── Stream: POST /tts/stream, [4-byte BE length][WAV] frames ───────────────
$('stream').onclick = async () => {
  busy(true, 'streaming…');
  const t0 = performance.now();
  const playQueue = [];        // play chunks back-to-back as they arrive
  let playing = false;
  function playNext() {
    const b = playQueue.shift();
    if (!b) { playing = false; return; }
    playing = true;
    const a = new Audio(URL.createObjectURL(b));
    a.onended = a.onerror = () => { URL.revokeObjectURL(a.src); playNext(); };
    a.play().catch(playNext);
  }
  try {
    const r = await fetch('/tts/stream', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: reqBody() });
    if (!r.ok) { addEntry({ mode: 'stream', error: await errorText(r) }); return; }
    const reader = r.body.getReader();
    let buf = new Uint8Array(0), firstChunkS = null;
    const blobs = [];
    while (true) {
      const { done, value } = await reader.read();
      if (value) {
        const merged = new Uint8Array(buf.length + value.length);
        merged.set(buf); merged.set(value, buf.length);
        buf = merged;
      }
      while (buf.length >= 4) {
        const len = new DataView(buf.buffer, buf.byteOffset).getUint32(0);
        if (buf.length < 4 + len) break;
        const blob = new Blob([buf.slice(4, 4 + len)], { type: 'audio/wav' });
        buf = buf.slice(4 + len);
        if (firstChunkS === null) firstChunkS = (performance.now() - t0) / 1000;
        blobs.push(blob);
        playQueue.push(blob);
        if (!playing) playNext();
      }
      if (done) break;
    }
    const totalS = (performance.now() - t0) / 1000;
    if (!blobs.length) { addEntry({ mode: 'stream', error: 'stream ended with no frames' }); return; }
    let audioS = 0;
    for (const b of blobs) audioS += await audioDuration(b) || 0;
    addEntry({ mode: 'stream', blobs, nums:
      `first chunk <b>${firstChunkS.toFixed(2)}s</b> · <b>${blobs.length}</b> chunk${blobs.length > 1 ? 's' : ''}` +
      ` · total <b>${totalS.toFixed(2)}s</b> · audio <b>${audioS.toFixed(2)}s</b>` +
      ` · <b>${(audioS / totalS).toFixed(2)}×</b> realtime` });
  } catch (e) {
    addEntry({ mode: 'stream', error: String(e) });
  } finally { busy(false); }
};

loadHealth();
loadVoices();
</script>
</body>
</html>
