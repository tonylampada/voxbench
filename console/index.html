<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTS console</title>
<style>
  /* Same room as /test: warm near-black, amber signal, mono for evidence. */
  :root {
    color-scheme: dark;
    --ground: #141110; --panel: #1c1815; --inset: #211c17; --line: #302a24;
    --text: #e9e2d6; --muted: #998f80; --faint: #6e6558;
    --signal: #e69f35; --lamp: #8fbf72; --fault: #d97b6c;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 system-ui, sans-serif; background: var(--ground); color: var(--text);
         max-width: 960px; margin: 0 auto; padding: 1.6rem 1.2rem 3rem; }
  a { color: var(--signal); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  header { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap;
           border-bottom: 1px solid var(--line); padding-bottom: .9rem; margin-bottom: 1.2rem; }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 650; letter-spacing: .14em;
       text-transform: uppercase; }
  h1::before { content: ""; display: inline-block; width: .55em; height: .55em;
               background: var(--signal); border-radius: 1px; margin-right: .6em; }
  header .sub { color: var(--muted); font-size: .85rem; }

  /* gauges */
  .bars { display: flex; gap: 1.2rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .meter { flex: 1; min-width: 260px; background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; padding: .7rem .9rem; }
  .meter .lbl { display: flex; justify-content: space-between; align-items: baseline; }
  .meter .lbl span:first-child { font-size: .68rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: .16em; font-weight: 600; }
  .meter .lbl span:last-child { font: .82rem/1.4 var(--mono);
    font-variant-numeric: tabular-nums; }
  .meter .track { background: var(--inset); border-radius: 4px; height: 8px; margin-top: .5rem;
                  overflow: hidden; }
  .meter .fill { background: var(--signal); height: 100%; transition: width .5s; }
  .meter .fill.hot { background: var(--fault); }
  .unavail { color: var(--muted); font-size: .8rem; margin-top: .4rem; }

  #gpuline { display: flex; gap: .6rem; align-items: baseline; color: var(--muted);
             margin: 0 0 1.4rem; font-size: .88rem; padding: .55rem .9rem;
             background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  #gpuline::before { content: ""; width: 9px; height: 9px; border-radius: 50%; flex: none;
                     align-self: center; background: var(--lamp);
                     box-shadow: 0 0 6px 1px rgba(143,191,114,.55); }
  #gpuline.warn { color: var(--signal); }
  #gpuline.warn::before { background: var(--signal); box-shadow: 0 0 6px 1px rgba(230,159,53,.55); }

  /* rack */
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: .68rem; text-transform: uppercase;
       letter-spacing: .14em; }
  td { font-variant-numeric: tabular-nums; }
  .num { font-family: var(--mono); font-size: .82rem; }
  .chip { font: .72rem/1.6 var(--mono); padding: .06rem .5rem; border-radius: 3px;
          border: 1px solid var(--line); background: var(--inset); }
  .chip.gpu { color: var(--lamp); } .chip.cpu { color: var(--muted); }
  .st { font: .78rem/1.5 var(--mono); text-transform: uppercase; letter-spacing: .05em;
        display: inline-flex; align-items: center; gap: .45rem; white-space: nowrap; }
  .st::before { content: ""; width: 8px; height: 8px; border-radius: 50%;
                background: var(--faint); }
  .st.ready { color: var(--lamp); }
  .st.ready::before { background: var(--lamp); box-shadow: 0 0 5px 1px rgba(143,191,114,.55); }
  .st.loading { color: var(--signal); }
  .st.loading::before { background: var(--signal); box-shadow: 0 0 5px 1px rgba(230,159,53,.55);
                        animation: pulse 1.1s ease-in-out infinite; }
  .st.stopped { color: var(--faint); }
  .st.dead { color: var(--fault); }
  .st.dead::before { background: var(--fault); box-shadow: 0 0 5px 1px rgba(217,123,108,.55); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .st.loading::before { animation: none; } }

  button { background: var(--inset); color: var(--text); border: 1px solid var(--line);
           border-radius: 5px; padding: .3rem .85rem; cursor: pointer; font: inherit; }
  button:hover { border-color: #4a4032; background: #262019; }
  button:disabled { opacity: .4; cursor: default; }
  .err { color: var(--fault); font-size: .82rem; margin-top: .2rem; white-space: pre-wrap; }
  .note { color: var(--faint); font-size: .78rem; }
  .detail { color: var(--muted); font-size: .78rem; }

  @media (max-width: 640px) {
    body { padding: .9rem .7rem 2rem; }
    .meter { min-width: 100%; }
    .bars { gap: .8rem; }
    button { min-height: 2.3rem; font-size: 1rem; }
    th, td { padding: .5rem .35rem; }
    /* the gauges above already tell the memory story — on a phone the rack
       keeps only what you act on: name, device, state, button */
    th:nth-child(4), td:nth-child(4), th:nth-child(5), td:nth-child(5) { display: none; }
  }
</style>

<header>
  <h1>TTS console</h1>
  <span class="sub">engines on this machine, loopback only · <a href="/test">test bench</a></span>
</header>

<div class="bars">
  <div class="meter"><div class="lbl"><span>RAM</span><span id="ramtxt">…</span></div>
    <div class="track"><div class="fill" id="rambar" style="width:0"></div></div></div>
  <div class="meter"><div class="lbl"><span>VRAM</span><span id="vramtxt">…</span></div>
    <div class="track"><div class="fill" id="vrambar" style="width:0"></div></div>
    <div class="unavail" id="vramwhy" hidden></div></div>
</div>
<p id="gpuline">…</p>

<table>
  <thead><tr><th>engine</th><th>device</th><th>state</th><th>vram</th><th>uptime</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script>
const $ = id => document.getElementById(id);
const mb = v => v >= 1024 ? (v/1024).toFixed(1) + ' GB' : v + ' MB';
const dur = s => s == null ? '' : s < 60 ? s + 's' : s < 3600 ?
  Math.floor(s/60) + 'm' + (s%60) + 's' : Math.floor(s/3600) + 'h' + Math.floor(s%3600/60) + 'm';
let clickErr = {};   // engine -> message from a refused POST /up
let loadingSince = {};

function bar(el, txt, used, total, hotAt) {
  el.style.width = (100*used/total).toFixed(1) + '%';
  el.classList.toggle('hot', used/total > (hotAt ?? .85));
  txt.textContent = mb(used) + ' / ' + mb(total);
}

async function refresh() {
  let m, engines;
  try {
    [m, engines] = await Promise.all([
      fetch('/api/machine').then(r => r.json()),
      fetch('/api/engines').then(r => r.json())]);
  } catch (e) { $('gpuline').textContent = 'console server unreachable: ' + e; return; }

  bar($('rambar'), $('ramtxt'), m.ram.used_mb, m.ram.total_mb);
  if (m.vram.unavailable) {
    $('vramtxt').textContent = 'unavailable';
    $('vramwhy').hidden = false; $('vramwhy').textContent = m.vram.unavailable;
  } else {
    $('vramwhy').hidden = true;
    bar($('vrambar'), $('vramtxt'), m.vram.used_mb, m.vram.total_mb);
  }
  $('gpuline').classList.toggle('warn', !!m.gpu_other);
  $('gpuline').textContent = m.gpu_engine
    ? `GPU: held by ${m.gpu_engine} — one 24 GB card fits one big model; stop it to load another.`
    : m.gpu_other
    ? `GPU: ${mb(m.gpu_other.used_mb)} in use by something outside this registry` +
      (m.gpu_other.processes.length
        ? ` (${m.gpu_other.processes.map(p => `pid ${p.pid} ${p.name} ${mb(p.used_mb)}`).join(', ')})`
        : '') + ` — no engine here holds it, and a big model may not fit.`
    : 'GPU: free.';

  $('rows').replaceChildren(...engines.map(e => {
    const tr = document.createElement('tr');
    if (e.state === 'loading') loadingSince[e.name] ??= Date.now();
    else delete loadingSince[e.name];
    const elapsed = loadingSince[e.name] ? Math.floor((Date.now()-loadingSince[e.name])/1000) : 0;
    const blocked = e.gpu === 'gpu' && e.state === 'stopped' && m.gpu_engine && m.gpu_engine !== e.name;
    const err = clickErr[e.name] || e.error;
    tr.innerHTML = `
      <td>${e.state === 'ready' ? `<a href="http://127.0.0.1:${e.port}/" target="_blank">${e.name}</a>` : e.name}
        ${err ? `<div class="err"></div>` : ''}
        ${e.state === 'loading' && e.detail ? `<div class="detail"></div>` : ''}</td>
      <td><span class="chip ${e.gpu}">${e.gpu}</span> <span class="note num">:${e.port}</span></td>
      <td><span class="st ${e.state}">${e.state}${e.state === 'loading' ? ' ' + elapsed + 's' : ''}</span></td>
      <td class="num">${e.vram_mb != null ? mb(e.vram_mb) : ''}</td>
      <td class="num">${dur(e.uptime_s)}</td>
      <td>${e.state === 'stopped'
            ? `<button data-act="up">start</button>` +
              (blocked ? `<div class="note">card held by ${m.gpu_engine} — stop it first</div>` : '')
            : `<button data-act="down">stop</button>`}</td>`;
    if (err) tr.querySelector('.err').textContent = err;
    if (e.state === 'loading' && e.detail) tr.querySelector('.detail').textContent = e.detail;
    tr.querySelector('button')?.addEventListener('click', () => act(e.name, tr.querySelector('button').dataset.act));
    return tr;
  }));
}

async function act(name, verb) {
  delete clickErr[name];
  const r = await fetch(`/api/engines/${name}/${verb}`, {method: 'POST'});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) clickErr[name] = j.error || (verb + ' failed: HTTP ' + r.status);
  refresh();
}

refresh();
setInterval(refresh, 2000);
</script>
