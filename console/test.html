<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTS test bench</title>
<style>
  /* The listening room, same as the machine panel: warm near-black ground, one
     amber signal reserved for sound and action, a green lamp for "running",
     mono for evidence. Two surfaces: the console desk (configure) on the left,
     the session tape (listen, compare) as the centre of the page. */
  :root {
    color-scheme: dark;
    --ground: #141110; --panel: #1c1815; --inset: #241d17; --line: #332b23;
    --text: #ede6d9; --muted: #9c9183; --faint: #6f6659;
    --signal: #e8a343; --lamp: #8fc172; --fault: #d97b6c;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { font: 15px/1.5 system-ui, sans-serif; background: var(--ground); color: var(--text);
         max-width: 1160px; margin: 0 auto; padding: 1.6rem 1.2rem 3.5rem; }
  a { color: var(--signal); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  header { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap;
           border-bottom: 1px solid var(--line); padding-bottom: .9rem; margin-bottom: 1.3rem; }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 650; letter-spacing: .14em;
       text-transform: uppercase; }
  h1::before { content: ""; display: inline-block; width: .55em; height: .55em;
               background: var(--signal); border-radius: 1px; margin-right: .6em; }
  header .sub { color: var(--muted); font-size: .85rem; }

  .lbl { display: block; font-size: .68rem; letter-spacing: .16em; text-transform: uppercase;
         color: var(--muted); font-weight: 600; margin-bottom: .45rem; }
  .note { color: var(--faint); font-size: .8rem; }
  .note a { color: var(--signal); }

  /* ── the deck: desk | tape ───────────────────────────────────────────── */
  .deck { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 1.5rem;
          align-items: start; }
  .desk { position: sticky; top: 1rem; display: flex; flex-direction: column; gap: 1.05rem;
          background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
          padding: 1.1rem 1.15rem 1.15rem; }

  select, input, textarea { width: 100%; background: var(--inset); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; padding: .5rem .65rem; font: inherit; }
  textarea { min-height: 3.4em; resize: vertical; }

  /* engine chips — only what is running gets a chip at all */
  .chips { display: flex; flex-wrap: wrap; gap: .45rem; }
  .echip { display: inline-flex; gap: .55rem; align-items: center; padding: .4rem 1rem .4rem .8rem;
           border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
           background: var(--inset); color: var(--text); font: .85rem var(--mono); }
  .echip:hover { border-color: #4a4032; }
  .echip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lamp);
                box-shadow: 0 0 6px 1px rgba(143,193,114,.55); }
  .echip .dev { font-size: .66rem; color: var(--faint); letter-spacing: .06em; }
  .echip.on { border-color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal); }

  /* actions — one big amber act of listening; stream only exists if the engine streams */
  .actions { display: flex; gap: .6rem; flex-wrap: wrap; padding-top: .15rem; }
  .actions button { border-radius: 999px; padding: .62rem 1.4rem; font: 600 .95rem/1.2 system-ui;
                    cursor: pointer; }
  #go { background: var(--signal); border: 1px solid var(--signal); color: #1c1300; }
  #go:hover { background: #f0b155; border-color: #f0b155; }
  #gostream { background: none; border: 1px solid #7a5c26; color: var(--signal); }
  #gostream:hover { border-color: var(--signal); }
  .actions button:disabled { opacity: .4; cursor: default; }

  /* drawers — the necessary evils fold away */
  details.drawer { border-top: 1px solid var(--line); padding-top: .7rem; }
  details.drawer summary { cursor: pointer; list-style: none; display: flex; gap: .5rem;
    align-items: baseline; font-size: .68rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; }
  details.drawer summary::-webkit-details-marker { display: none; }
  details.drawer summary::before { content: "▸"; color: var(--faint); transition: transform .15s; }
  details.drawer[open] summary::before { transform: rotate(90deg); }
  details.drawer summary .n { color: var(--faint); font-family: var(--mono); font-weight: 400; }
  details.drawer > *:not(summary) { margin-top: .7rem; }

  .knob { margin: .7rem 0; }
  .knob .kh { display: flex; justify-content: space-between; font-size: .84rem; }
  .knob .kh b { font-weight: 600; }
  .knob .kh .val { color: var(--signal); font-family: var(--mono); font-size: .8rem;
                   font-variant-numeric: tabular-nums; }
  .knob input[type=range] { width: 100%; accent-color: #7d6f57; padding: 0; }
  .knob .desc { color: var(--faint); font-size: .74rem; }

  /* phrase library rows */
  .ph { display: flex; gap: .55rem; align-items: baseline; padding: .3rem 0; }
  .ph .phtag { font: .68rem/1.6 var(--mono); color: var(--muted); border: 1px solid var(--line);
               border-radius: 3px; padding: .02rem .45rem; white-space: nowrap; }
  .ph .phtxt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; font-size: .82rem; color: var(--muted); }
  .ph .del { background: none; border: none; color: var(--faint); cursor: pointer;
             padding: 0 .25rem; font-size: 1rem; line-height: 1; }
  .ph .del:hover { color: var(--fault); }
  #addform { display: grid; grid-template-columns: 1fr 5.5rem; gap: .5rem; }
  #addform textarea, #addform .row2 { grid-column: 1 / -1; }
  #addform .row2 { display: flex; gap: .5rem; align-items: center; }
  #addform button { background: var(--inset); color: var(--text); border: 1px solid var(--line);
                    border-radius: 999px; padding: .4rem 1.1rem; cursor: pointer; font: inherit; }
  #addform button:hover { border-color: #4a4032; }

  .deskerr { color: var(--fault); font-size: .82rem; white-space: pre-wrap; }
  .deskerr:empty { display: none; }

  /* ── the session tape ────────────────────────────────────────────────── */
  .tapehead { display: flex; align-items: baseline; gap: .6rem; padding: .35rem 0 .45rem;
              border-bottom: 1px solid var(--line); }
  .tapehead .lbl { margin: 0; }
  .tapehead .n { font: .72rem var(--mono); color: var(--faint); }
  #takes { list-style: none; margin: 0; padding: 0; }
  #empty { color: var(--faint); font-size: .85rem; padding: 2.2rem .2rem; }

  .take { display: flex; gap: .95rem; align-items: center; padding: .85rem .15rem;
          border-bottom: 1px solid var(--line); }
  .take .pp { width: 46px; height: 46px; border-radius: 50%; flex: none; cursor: pointer;
              background: var(--inset); border: 1px solid var(--line);
              display: grid; place-items: center; padding: 0; }
  .take .pp:hover { border-color: var(--signal); }
  .take .pp:disabled { cursor: default; border-color: var(--line); }
  .take .pp svg { width: 15px; height: 15px; fill: var(--text); display: none; }
  .take .pp .i-play { margin-left: 2px; }
  .take.done .pp .i-play { display: block; }
  .take.playing .pp { background: var(--signal); border-color: var(--signal); }
  .take.playing .pp .i-play { display: none; }
  .take.playing .pp .i-pause { display: block; fill: #1c1300; }
  .take.live .pp { border-color: var(--signal); animation: breathe 1.2s ease-in-out infinite; }
  .take.live .pp .i-stop { display: block; fill: var(--signal); }
  .take.running .pp .i-dot { display: block; fill: var(--faint);
                             animation: breathe 1.2s ease-in-out infinite; }
  .take.error .pp { opacity: .35; }
  .take.error .pp .i-x { display: block; fill: var(--faint); }
  @keyframes breathe { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .take .pp, .onair { animation: none !important; } }

  .take .mid { flex: 1; min-width: 0; }
  .l1 { display: flex; gap: .6rem; align-items: baseline; min-width: 0; }
  .l1 .eng { font: 600 .85rem var(--mono); }
  .l1 .mk { font: .7rem var(--mono); color: var(--signal); white-space: nowrap; }
  .l1 .prov { color: var(--muted); font-size: .8rem; overflow: hidden;
              text-overflow: ellipsis; white-space: nowrap; }
  .l1 .tn { margin-left: auto; font: .72rem var(--mono); color: var(--faint); }
  .strip { height: 4px; background: var(--inset); border-radius: 2px; margin: .5rem 0 .4rem;
           cursor: pointer; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--signal); }
  .l2 { display: flex; gap: 1.1rem; flex-wrap: wrap; align-items: baseline; }
  .fig { font: .76rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums;
         white-space: nowrap; }
  .fig b { color: var(--text); font-weight: 600; font-size: .82rem; }
  .fig.amber, .fig.amber b { color: var(--signal); }
  .onair { font: 600 .7rem var(--mono); letter-spacing: .14em; text-transform: uppercase;
           color: var(--signal); animation: breathe 1.2s ease-in-out infinite; }
  /* a 4xx is the engine answering, not the page breaking */
  .refusal { color: var(--muted); font-style: italic; font-size: .82rem; }
  .refusal .who { font: normal .68rem var(--mono); color: var(--faint);
                  text-transform: uppercase; letter-spacing: .12em; font-style: normal;
                  margin-right: .5rem; }
  .err { color: var(--fault); font-size: .82rem; }

  /* ?like=mini — a small transport, fixed above the fold of the thumb */
  #mini { position: fixed; left: 50%; transform: translateX(-50%); bottom: 1rem;
          display: flex; gap: .4rem; align-items: center; z-index: 5;
          background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
          padding: .4rem .5rem .4rem .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  #mini[hidden] { display: none; }
  #mini .what { font: .75rem var(--mono); color: var(--muted); max-width: 40vw;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mini button { width: 2.2rem; height: 2.2rem; border-radius: 50%; cursor: pointer;
                 background: var(--inset); border: 1px solid var(--line); color: var(--text);
                 font-size: .8rem; line-height: 1; padding: 0; }
  #mini button:hover { border-color: var(--signal); }

  @media (max-width: 760px) {
    body { padding: .9rem .8rem 2.5rem; }
    .deck { grid-template-columns: 1fr; gap: 1.1rem; }
    .desk { position: static; }
    button, select, input { min-height: 2.4rem; }
    .l1 .prov { white-space: normal; }
  }
</style>

<header>
  <h1>Test bench</h1>
  <span class="sub">the listening side · models load on the <a href="/">machine panel</a></span>
</header>

<div class="deck">
<section class="desk" aria-label="controls">
  <div>
    <span class="lbl">Engine — running now</span>
    <div class="chips" id="engines"></div>
    <p class="note" id="enginenote">…</p>
  </div>

  <div id="controls" hidden>
    <div style="margin-bottom:1rem">
      <label class="lbl" for="phrase">Phrase</label>
      <select id="phrase"></select>
    </div>
    <div style="margin-bottom:1rem">
      <label class="lbl" for="voice">Voice</label>
      <select id="voice"></select>
    </div>
    <details class="drawer" id="paramdrawer" style="margin-bottom:1rem">
      <summary>Parameters <span class="n" id="paramn"></span></summary>
      <div id="knobs"></div>
    </details>
    <div class="actions">
      <button id="go" type="button">▶&nbsp; Generate</button>
      <button id="gostream" type="button" hidden>≋&nbsp; Stream live</button>
    </div>
    <p class="deskerr" id="deskerr"></p>
  </div>

  <details class="drawer" id="library">
    <summary>Phrase library <span class="n" id="libn"></span></summary>
    <div id="phraselist"></div>
    <form id="addform">
      <input id="pname" placeholder="name — e.g. greeting" required>
      <input id="plang" placeholder="lang" size="4" required>
      <textarea id="ptext" placeholder="the phrase itself" required></textarea>
      <div class="row2">
        <button type="submit">add phrase</button>
        <span class="note" id="libnote"></span>
      </div>
    </form>
  </details>
</section>

<section class="tape" aria-label="generated audio">
  <div class="tapehead"><span class="lbl">Session tape</span>
    <span class="n" id="count"></span>
    <span class="n" style="margin-left:auto">newest first</span></div>
  <ol id="takes"></ol>
  <p id="empty">Nothing on the tape yet — pick an engine, pick a phrase, press generate.
     Every take lands here so you can play them against each other.</p>
</section>
</div>

<!-- Live streams play THROUGH this element, not straight out of the AudioContext:
     the OS keeps a playing media element scheduled when the screen goes off, and
     suspends a bare page. It renders nothing — no controls, no sound of its own. -->
<audio id="sink" playsinline></audio>

<!-- ?like=mini — the small visible transport. Plain on purpose: it is here to be
     seen by WebKit and pressed by a thumb, not admired. -->
<div id="mini" hidden>
  <span class="what"></span>
  <button type="button" id="mplay" title="play">▶</button>
  <button type="button" id="mpause" title="pause">❚❚</button>
  <button type="button" id="mstop" title="stop">■</button>
</div>

<script>
const $ = id => document.getElementById(id);
const ms = v => v == null ? '—' : v < 1000 ? Math.round(v) + ' ms' : (v/1000).toFixed(2) + ' s';

let phrases = [];
let ready = [];            // engines with state === "ready" — the only ones offered
let current = null;        // selected engine name
const eng = {};            // name -> {voices, params, values, canStream, busy}
const takes = [];          // newest first — the memory of the session
let takeN = 0;
let audioCtx;
let sink;                  // MediaStreamAudioDestinationNode, null once refused
let sinkEl;                // the element sound leaves through
let primed = false;        // ?like=tap: the board opens its element once, ever

/* ── converging on the board ─────────────────────────────────────────────
   The board runs the same pauseLive/resumeLive code as this page, and on the
   captain's phone it never comes back from pause while this page does. Same
   iOS, same verbs, different result — so the cause is somewhere in what is
   AROUND them, and the only way to name it is to make this page do what the
   board does, one difference at a time, until it breaks too.

   ?like=<name>[,<name>…] switches on exactly one of those differences; no
   query string is today's bench, untouched. `all` is the board.

     hidden     nothing player-like on the take while streaming
     ctx        a fresh AudioContext per stream at the engine's rate, built
                after the response headers, closed when the stream ends
     tap        the element's play() and the lock-screen metadata happen
                after the headers instead of inside the captain's tap
     srcobject  closing drops srcObject and the metadata, not just pause
     element    the element is built by script, not written in the page

   A probe, not a feature. It comes out the moment the difference has a name. */
const LIKE = new Set((new URLSearchParams(location.search).get('like') || '')
  .split(',').map(s => s.trim()).filter(Boolean));
const like = f => LIKE.has(f) || LIKE.has('all');

/* ?like=anchor is the one name here that is not a difference to converge on —
   it goes the other way. Every element this page owns is fed by a MediaStream,
   and the reading is that iOS does not hand the lock screen to one of those: it
   hands it to real media it can see playing. So `anchor` keeps a real one on the
   page for as long as the stream runs — a WAV of zeros, looping, heard by
   nobody, playing for no reason but to be something the media session can hold.
   Combine it with `hidden` (?like=hidden,anchor) to ask whether it is enough, or
   take it alone to ask whether it was ever needed. Deliberately NOT part of
   `all`: the board has no anchor, that is the whole point.

   On the phone the anchor alone did not do it, and two things about it could be
   why, so there are two more names that go the same way:

     loud    the anchor, carrying sound instead of zeros — asks whether WebKit
             simply refuses to hand the session to silence. Implies `anchor`.
     ghost   not a second player alongside the live one, but the bench's own take
             player without the take: one element with a real WAV FILE in it, on
             the page, played through and then left idle — which is the state the
             page is in from the second take onward, the state that works.
     mini    the opposite of `hidden`: a small visible transport — play, pause,
             stop — on screen for as long as the message speaks, fed by the same
             MediaStream. Asks whether what WebKit wants is simply a player it
             can see. It replaces the row's animated bubble while it is up. */
const anchored = LIKE.has('anchor') || LIKE.has('loud');

/* ── phrases ─────────────────────────────────────────────────────────── */
const phraseLabel = p => p.lang ? `${p.label} · ${p.lang}` : p.label;

async function loadPhrases() {
  const keep = $('phrase').value;
  phrases = (await (await fetch('/api/phrases')).json()).phrases;
  $('phrase').replaceChildren(...phrases.map(p => new Option(
    `${phraseLabel(p)} — ${p.text.length > 44 ? p.text.slice(0, 44) + '…' : p.text}`, p.id)));
  if (phrases.some(p => p.id == keep)) $('phrase').value = keep;
  $('libn').textContent = phrases.length;
  renderLibrary();
}

function renderLibrary() {
  $('phraselist').replaceChildren(...phrases.map(p => {
    const div = document.createElement('div');
    div.className = 'ph';
    div.innerHTML = `<span class="phtag"></span><span class="phtxt"></span>
      <button class="del" type="button" title="delete">×</button>`;
    div.querySelector('.phtag').textContent = phraseLabel(p);
    div.querySelector('.phtxt').textContent = p.text;
    div.querySelector('.del').onclick = async () => {
      await fetch('/api/phrases/' + p.id, {method: 'DELETE'});
      loadPhrases();
    };
    return div;
  }));
}

$('addform').onsubmit = async e => {
  e.preventDefault();
  const body = {name: $('pname').value.trim(), lang: $('plang').value.trim(),
                text: $('ptext').value.trim()};
  const r = await fetch('/api/phrases', {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  $('libnote').textContent = r.ok ? 'saved — it survives a restart' : (j.error || 'failed');
  if (r.ok) {
    $('pname').value = $('plang').value = $('ptext').value = '';
    await loadPhrases();
    $('phrase').value = j.id;   // fresh phrase is ready to use on the desk
  }
};

/* ── engines: only what is running is offered ────────────────────────── */
async function refreshEngines() {
  let all;
  try { all = await (await fetch('/api/engines')).json(); }
  catch { $('enginenote').textContent = 'console server unreachable'; return; }
  ready = all.filter(e => e.state === 'ready');
  renderChips();
  const loading = all.filter(e => e.state === 'loading').map(e => e.name);
  const note = $('enginenote');
  if (!ready.length) {
    note.replaceChildren(loading.length
      ? `${loading.join(', ')} is loading — it appears here when it answers`
      : 'nothing is running. Load a model on the ');
    if (!loading.length) {
      const a = Object.assign(document.createElement('a'), {href: '/', textContent: 'machine panel'});
      note.append(a, ', then come back and listen.');
    }
  } else {
    note.replaceChildren('to test a different model, load it on the ',
      Object.assign(document.createElement('a'), {href: '/', textContent: 'machine panel'}), '.');
  }
  if (current && !ready.some(e => e.name === current)) selectEngine(null);
  if (!current && ready.length === 1) selectEngine(ready[0].name);
}

function renderChips() {
  $('engines').replaceChildren(...ready.map(e => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'echip' + (e.name === current ? ' on' : '');
    b.innerHTML = `<span class="dot"></span><span class="nm"></span><span class="dev">${e.gpu}</span>`;
    b.querySelector('.nm').textContent = e.name;
    b.onclick = () => selectEngine(e.name);
    return b;
  }));
}

async function selectEngine(name) {
  current = name;
  renderChips();
  $('controls').hidden = !name;
  $('deskerr').textContent = '';
  if (!name) return;
  const c = eng[name] ??= {values: {}};
  $('gostream').hidden = c.canStream !== true;
  setBusy();
  if (!c.voices) {
    $('voice').replaceChildren(new Option('fetching voices…', ''));
    $('knobs').replaceChildren();
    try {
      const [vr, pr] = await Promise.all([
        fetch(`/api/engines/${name}/voices`), fetch(`/api/engines/${name}/params`)]);
      if (!vr.ok || !pr.ok) throw new Error(`voices ${vr.status} / params ${pr.status}`);
      c.voices = (await vr.json()).voices;
      c.params = (await pr.json()).params;
    } catch (err) {
      c.voices = null;
      if (current === name) $('deskerr').textContent = 'could not reach ' + name + ': ' + err;
      return;
    }
  }
  if (current !== name) return;         // switched away while fetching
  renderVoices(c);
  renderKnobs(c);
  if (c.canStream === undefined) { c.canStream = 'probing'; probeStream(name); }
}

/* The stream button exists only on engines that stream — and the engine itself
   is the authority: stream:true gets a 200 from a streamer and a 400 sentence
   from everything else. One tiny probe per engine, remembered. */
async function probeStream(name) {
  const key = 'canstream:' + name;
  let can = {['1']: true, ['0']: false}[localStorage.getItem(key)];
  if (can === undefined) {
    try {
      const ac = new AbortController();
      const r = await fetch(`/api/engines/${name}/speech`, {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({input: '.', stream: true}), signal: ac.signal});
      ac.abort();                        // status is the answer; no need for audio
      if (r.status === 200) { can = true; localStorage.setItem(key, '1'); }
      else if (r.status === 400) { can = false; localStorage.setItem(key, '0'); }
      else can = false;                  // engine wobbled — ask again next time
    } catch { can = false; }
  }
  eng[name].canStream = can;
  if (current === name) $('gostream').hidden = !can;
}

function renderVoices(c) {
  const sel = $('voice');
  sel.replaceChildren(new Option('engine default', ''));
  const kinds = [['builtin', 'builtin voices'], ['reference', 'cloned references']];
  for (const [kind, label] of kinds) {
    const vs = c.voices.filter(v => v.kind === kind);
    if (!vs.length) continue;
    const g = document.createElement('optgroup');
    g.label = label;
    for (const v of vs)
      g.append(new Option(`${v.name} · ${v.langs.join(' ')} · ${v.gender}` +
                          (v.origin ? ` · from ${v.origin}` : ''), v.id));
    sel.append(g);
  }
}

function renderKnobs(c) {
  const knobs = $('knobs');
  const entries = Object.entries(c.params);
  $('paramn').textContent = entries.length || 'none';
  knobs.replaceChildren();
  if (!entries.length) {
    knobs.innerHTML = '<div class="note">this engine declares no knobs</div>';
    return;
  }
  for (const [k, p] of entries) {
    const div = document.createElement('div');
    div.className = 'knob';
    const cur = c.values[k] ?? p.default;   // remember what was dialed in
    if (p.type === 'number' || p.type === 'integer') {
      const step = p.type === 'integer' ? 1
        : Math.pow(10, Math.floor(Math.log10((p.max - p.min) / 100)));
      div.innerHTML = `<div class="kh"><b></b><span class="val">${cur}</span></div>
        <input type="range" min="${p.min}" max="${p.max}" value="${cur}" step="${step}">
        <div class="desc"></div>`;
      div.querySelector('input').oninput = ev => {
        const v = p.type === 'integer' ? parseInt(ev.target.value) : parseFloat(ev.target.value);
        div.querySelector('.val').textContent = v;
        v === p.default ? delete c.values[k] : c.values[k] = v;
      };
    } else if (p.type === 'boolean') {
      div.innerHTML = `<div class="kh"><b><label><input type="checkbox" style="width:auto"
          ${cur ? 'checked' : ''}> <span class="kn"></span></label></b></div><div class="desc"></div>`;
      div.querySelector('input').onchange = ev =>
        ev.target.checked === p.default ? delete c.values[k] : c.values[k] = ev.target.checked;
    } else {
      div.innerHTML = `<div class="kh"><b></b></div><input type="text"><div class="desc"></div>`;
      const inp = div.querySelector('input');
      inp.value = String(cur);
      inp.oninput = ev =>
        ev.target.value === String(p.default) ? delete c.values[k] : c.values[k] = ev.target.value;
    }
    (div.querySelector('.kn') || div.querySelector('b')).textContent = k;
    div.querySelector('.desc').textContent = (p.description ? p.description + ' ' : '') +
      (p.min != null ? `(${p.min}–${p.max}, default ${p.default})` : `(default ${p.default})`);
    knobs.appendChild(div);
  }
}

function setBusy() {
  const busy = !!(current && eng[current]?.busy);
  $('go').disabled = busy;
  $('gostream').disabled = busy;
}

/* ── takes: everything generated falls onto the tape ─────────────────── */
function addTake(init) {
  const t = {id: ++takeN, state: 'running', ...init};
  takes.unshift(t);
  t.el = buildTakeEl(t);
  $('takes').prepend(t.el);
  $('empty').hidden = true;
  $('count').textContent = takes.length + (takes.length === 1 ? ' take' : ' takes');
  updateTake(t);
  return t;
}

function buildTakeEl(t) {
  const li = document.createElement('li');
  li.innerHTML = `
    <button class="pp" aria-label="play">
      <svg class="i-play" viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 16 16"><path d="M3 2h3.5v12H3zM9.5 2H13v12H9.5z"/></svg>
      <svg class="i-stop" viewBox="0 0 16 16"><path d="M3 3h10v10H3z"/></svg>
      <svg class="i-dot" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4"/></svg>
      <svg class="i-x" viewBox="0 0 16 16"><path d="M3 4.4 4.4 3 8 6.6 11.6 3 13 4.4 9.4 8l3.6 3.6-1.4 1.4L8 9.4 4.6 13 3.2 11.6 6.6 8z"/></svg>
    </button>
    <div class="mid">
      <div class="l1"><span class="eng"></span><span class="mk"></span>
        <span class="prov"></span><span class="tn"></span></div>
      <div class="strip"><div class="fill"></div></div>
      <div class="l2"></div>
    </div>`;
  li.querySelector('.pp').onclick = () => t.state === 'live' ? stopLive(t) : toggle(t);
  li.querySelector('.strip').onclick = e => {
    if (!t.audio || !t.audio.duration) return;
    const r = e.currentTarget.getBoundingClientRect();
    t.audio.currentTime = (e.clientX - r.left) / r.width * t.audio.duration;
  };
  return li;
}

function updateTake(t) {
  const el = t.el;
  // ?like=hidden — the board puts nothing player-like on screen while it speaks:
  // no transport, no ● live, no clock. A live take is shown as a busy one.
  // ?like=mini strips the same row, and puts a real transport up instead.
  const mute = t.state === 'live' && (like('hidden') || LIKE.has('mini'));
  el.className = 'take ' + (mute ? 'running' : t.state) + (t.audio && !t.audio.paused ? ' playing' : '');
  el.querySelector('.eng').textContent = t.engine;
  el.querySelector('.mk').textContent = t.mode === 'stream' ? '≋ stream' : '';
  el.querySelector('.prov').textContent = `${t.phrase} · ${t.voice}`;
  el.querySelector('.tn').textContent = String(t.id).padStart(2, '0');
  // A live take can ALWAYS be stopped from the page, whatever it is dressed as.
  // Stripping the row is a look; stop is the one verb that aborts the request,
  // and an abandoned synthesis is what kills the next one.
  el.querySelector('.pp').disabled = !(t.state === 'done' || t.state === 'live');
  mini(t);
  const l2 = el.querySelector('.l2');
  if (t.state === 'running' || mute) {
    l2.innerHTML = '<span class="fig">synthesizing…</span>';
  } else if (t.state === 'live') {
    // felt latency, as it happens: first sound the moment the first chunk lands
    l2.innerHTML = `<span class="onair">● live</span>
      <span class="fig amber">first sound <b>${t.ttfs != null ? ms(t.ttfs) : '…'}</b></span>
      <span class="fig"><span class="elapsed">0.0 s</span> elapsed</span>`;
  } else if (t.state === 'error') {
    l2.replaceChildren();
    const s = document.createElement('span');
    if (t.status && t.status < 500) {
      s.className = 'refusal';
      s.innerHTML = `<span class="who">the engine declined · ${t.status}</span>`;
      s.append(t.error);
    } else {
      s.className = 'err';
      s.textContent = (t.status ? t.status + ': ' : '') + t.error;
    }
    l2.append(s);
  } else {
    l2.innerHTML = `<span class="fig"><b>${t.dur != null ? t.dur.toFixed(1) + ' s' : '…'}</b> audio</span>`
      + (t.mode === 'stream'
        ? `<span class="fig amber">first sound <b>${ms(t.ttfs)}</b></span>
           <span class="fig">done in ${ms(t.gen)}</span>`
        : `<span class="fig">made in ${ms(t.gen)}</span>`);
  }
}

/* ?like=mini — one transport for whichever take is live, up while it speaks and
   gone the moment it is not. The three buttons are the three verbs the lock
   screen has, wired to the same three functions, so pressing them on screen and
   pressing them on the lock screen are the same act. */
let miniTake = null;
function mini(t) {
  if (!LIKE.has('mini')) return;
  if (t.state === 'live') miniTake = t;
  else if (miniTake !== t) return;          // some other take changed — not ours
  else miniTake = null;
  $('mini').hidden = !miniTake;
  $('mini').querySelector('.what').textContent = miniTake ? miniTake.phrase : '';
}
$('mplay').onclick = resumeLive;
$('mpause').onclick = pauseLive;
$('mstop').onclick = () => miniTake && stopLive(miniTake);

function attachAudio(t) {
  const a = t.audio = new Audio();
  a.preload = 'metadata';
  a.src = t.url;
  a.addEventListener('loadedmetadata', () => {
    if (isFinite(a.duration) && a.duration) { t.dur = a.duration; updateTake(t); }
  });
  a.addEventListener('timeupdate', () => {
    if (a.duration) t.el.querySelector('.fill').style.width = 100 * a.currentTime / a.duration + '%';
  });
  a.addEventListener('play', () => t.el.classList.add('playing'));
  a.addEventListener('pause', () => t.el.classList.remove('playing'));
  a.addEventListener('ended', () => {
    t.el.classList.remove('playing');
    t.el.querySelector('.fill').style.width = '0';
  });
}

function stopAll() {   // one voice at a time — this list is for comparing
  for (const x of takes) {
    if (x.audio && !x.audio.paused) x.audio.pause();
    // A paused take still holds queued buffers — without this they resume on
    // top of whatever starts next. Drop their onended with them: that callback
    // closes the sink, and the sink is about to belong to someone else.
    if (x.live) {
      for (const s of x.srcs) { s.onended = null; try { s.stop(); } catch {} }
      x.srcs = []; x.live = 0;
      closeSink();
    }
  }
}

function toggle(t) {
  if (!t.audio) return;
  if (!t.audio.paused) { t.audio.pause(); return; }
  stopAll();
  t.audio.play();
}

/* ── synthesis ───────────────────────────────────────────────────────── */
$('go').onclick = () => run(false);
$('gostream').onclick = () => run(true);

function run(stream) {
  if (!current) return;
  const name = current, c = eng[name];
  if (c.busy) return;
  const p = phrases.find(x => x.id == $('phrase').value);
  if (!p) return;
  const vid = $('voice').value;
  const body = {input: p.text, stream};
  if (vid) body.voice = vid;
  if (Object.keys(c.values).length) body.params = {...c.values};
  const t = addTake({engine: name, phrase: phraseLabel(p), mode: stream ? 'stream' : 'take',
                     voice: vid ? (c.voices.find(v => v.id === vid)?.name ?? vid) : 'default voice'});
  c.busy = true; setBusy();
  (stream ? runStream(t, body) : runTake(t, body))
    .finally(() => { c.busy = false; setBusy(); });
}

async function errText(r) {
  const txt = await r.text();
  try { return JSON.parse(txt).detail || JSON.parse(txt).error || txt; } catch { return txt; }
}

function failTake(t, status, msg) {
  Object.assign(t, {state: 'error', status, error: msg});
  closeSink();          // nothing is going to be heard — let go of the lock screen
  updateTake(t);
}

async function runTake(t, body) {
  const t0 = performance.now();
  try {
    const r = await fetch(`/api/engines/${t.engine}/speech`, {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    if (!r.ok) return failTake(t, r.status, await errText(r));
    const blob = await r.blob();
    t.gen = performance.now() - t0;
    if (!blob.size) return failTake(t, 0, '200 but the body was empty — no audio came back');
    t.url = URL.createObjectURL(blob);
    t.state = 'done';
    attachAudio(t);     // duration arrives via loadedmetadata
    updateTake(t);
  } catch (err) { failTake(t, 0, String(err)); }
}

function pcmToWav(chunks, rate) {
  let len = chunks.reduce((a, c) => a + c.length, 0);
  len &= ~1;   // 16-bit samples — an odd trailing byte is not audio
  const buf = new ArrayBuffer(44 + len), v = new DataView(buf), u = new Uint8Array(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + len, true); w(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, len, true);
  let o = 44;
  for (const c of chunks) { const n = Math.min(c.length, len - (o - 44)); u.set(c.subarray(0, n), o); o += n; }
  return new Blob([buf], {type: 'audio/wav'});
}

// ?like=element — the board has no element in its HTML; it builds one the first
// time it speaks and appends it to the body.
function element() {
  if (!sinkEl) {
    if (like('element')) {
      $('sink').remove();
      sinkEl = document.createElement('audio');
      sinkEl.playsInline = true;
      document.body.appendChild(sinkEl);
    } else sinkEl = $('sink');
  }
  return sinkEl;
}

// One second at 8 kHz: zeros, or with ?like=loud a 200 Hz tone at 1% of full
// scale — 40 dB under the speech, genuinely non-zero, nothing anyone notices.
// 40 samples to the period divides 8000 exactly, so the loop has no click in it.
function anchorWav() {
  const pcm = new Int16Array(8000);
  if (LIKE.has('loud'))
    for (let i = 0; i < pcm.length; i++) pcm[i] = Math.round(300 * Math.sin(i * Math.PI / 20));
  return pcmToWav([new Uint8Array(pcm.buffer)], 8000);
}

// ?like=anchor — the real media element, held alongside the live one. One second
// on a loop: an <audio> with no controls renders nothing and near-silence sounds
// like nothing, so it is present to the OS and absent to everyone else.
let anchorEl;
function anchor(on) {
  if (!anchored) return;
  if (!anchorEl) {
    anchorEl = document.createElement('audio');
    anchorEl.playsInline = true;
    anchorEl.loop = true;
    anchorEl.src = URL.createObjectURL(anchorWav());
    document.body.appendChild(anchorEl);
  }
  if (on) anchorEl.play().catch(() => {});   // blocked → nothing gained, nothing lost
  else anchorEl.pause();
}

/* ?like=ghost — the take player, without the take. `hidden` never removed an
   element: it only strips the take ROW, and the sink <audio> stays in the page
   and stays playing. What the sink has never had is a FILE — it is fed a
   MediaStream. So ghost puts the missing thing on the page: one element with a
   real WAV in it, appended, played through inside the tap and then left alone,
   which is exactly what a finished take is. Whatever is in it is beside the
   point; that it is there, and has played, is the whole question. */
let ghostEl;
function ghost() {
  if (!LIKE.has('ghost') || ghostEl) return;
  ghostEl = document.createElement('audio');
  ghostEl.playsInline = true;
  ghostEl.src = URL.createObjectURL(anchorWav());
  document.body.appendChild(ghostEl);
  ghostEl.play().catch(() => {});
}

/* The route to the speakers. Straight out of audioCtx.destination the sound dies
   the moment the screen locks — the OS suspends the page and the AudioContext
   with it. Sent into a MediaStream that the <audio> element is playing, it is
   real media playback to the OS and keeps going, which is exactly why a plain
   audio file survives a lock. Same buffers, same seams, one extra hop.
   Refused (no autoplay, old browser) → the speakers, i.e. today's behaviour,
   never silence. */
function openSink() {
  if (sink === null) return;                        // refused once, refused for good
  if (!sink) {
    if (!audioCtx.createMediaStreamDestination) { sink = null; return; }
    sink = audioCtx.createMediaStreamDestination();
    element().srcObject = sink.stream;
  }
  element().play().catch(() => { sink = null; });   // blocked → the speakers
}

// ?like=tap — the board's tap only touches the element, once ever, and on a
// source it has not attached yet. Everything that matters happens later.
function primeSink() {
  if (primed) return;
  primed = true;
  element().play().catch(() => {});
}

function closeSink() {
  element().pause();
  anchor(false);            // the speech is over — stop holding the lock screen open
  // ?like=srcobject — the board lets the stream go, so the phone stops showing
  // a player for speech that is over. This page only pauses.
  if (like('srcobject')) {
    element().srcObject = null;
    if (navigator.mediaSession) navigator.mediaSession.metadata = null;
  }
  closeCtx();
  playbackState('none');
}

// ?like=ctx — the board's context lives one message and is closed with it.
function closeCtx() {
  if (!like('ctx') || !audioCtx) return;
  const c = audioCtx;
  audioCtx = undefined; sink = undefined;
  try { c.close(); } catch {}
}

/* Lock screen: what is speaking, and three different verbs for it.
   pause freezes the AudioContext clock — chunks still arriving queue against a
   stopped clock, so nothing is lost and nothing plays; play unfreezes it. Only
   stop is destructive, and it has to be: it aborts the request so the ENGINE
   stops synthesizing. An abandoned synthesis overlapping the next request is
   what kills voxcpm2's CUDA context. */
function announce(t) {
  const s = navigator.mediaSession;
  if (!s) return;
  if (window.MediaMetadata) s.metadata = new MediaMetadata({title: t.phrase, artist: t.engine});
  s.playbackState = 'playing';
  const on = (a, fn) => { try { s.setActionHandler(a, fn); } catch {} };
  on('pause', pauseLive);
  on('play', resumeLive);
  on('stop', () => stopLive(t));
}

function playbackState(v) {
  if (navigator.mediaSession) navigator.mediaSession.playbackState = v;
}

// BOTH halves stop. Suspending the context alone freezes the buffers but leaves
// the element pulling on a MediaStream with nothing new in it, and it chews the
// last fragment over and over — "lá lá lá" in the middle of a word. Pause the
// element first, so nothing is being pulled while the clock stops.
function pauseLive() {
  if (sink) element().pause();
  anchor(false);            // paused means paused — including the thing holding the screen
  audioCtx?.suspend();
  playbackState('paused');
}

// Back in the same order, inside out: the clock first, then the element.
function resumeLive() {
  audioCtx?.resume();
  if (sink) element().play().catch(() => {});
  anchor(true);
  playbackState('playing');
}

/* Stream plays LIVE: each PCM chunk is queued into the AudioContext the moment
   it arrives, so sound starts on the first chunk — the whole point is feeling
   the engine's latency, not reading it afterwards. */
async function runStream(t, body) {
  // The board cannot open in the tap: its context is built at the engine's own
  // sample rate, which is not known until the response headers are in. So the
  // tap only blesses the element and the real opening happens an await later.
  const late = like('ctx') || like('tap');
  stopAll();                // synchronous, and before openSink: it closes the sink
  anchor(true);             // in the tap, like every other play() here — and after
                            // stopAll, which just turned the previous one off
  ghost();                  // also in the tap: it has to be allowed to play once
  if (late) primeSink();
  else {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    openSink();             // before any await: iOS only allows play() inside the tap
    announce(t);
    if (audioCtx.state === 'suspended') await audioCtx.resume();
  }
  const ac = new AbortController();
  Object.assign(t, {ac, srcs: [], live: 0, state: 'live'});
  updateTake(t);
  const t0 = performance.now();
  t.tick = setInterval(() => {
    const e = t.el.querySelector('.elapsed');
    if (e) e.textContent = ((performance.now() - t0) / 1000).toFixed(1) + ' s';
  }, 100);
  const chunks = []; let bytes = 0, rate = 24000;
  try {
    const r = await fetch(`/api/engines/${t.engine}/speech`, {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
      signal: ac.signal});
    if (!r.ok) { clearInterval(t.tick); return failTake(t, r.status, await errText(r)); }
    rate = parseInt(r.headers.get('x-sample-rate')) || 24000;
    if (late) {
      if (like('ctx')) audioCtx = new (window.AudioContext || window.webkitAudioContext)({sampleRate: rate});
      else audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
      // The board races resume against 250 ms and calls a context that did not
      // start a failure — it has no gesture left to wait for out here.
      if (audioCtx.state !== 'running')
        await Promise.race([audioCtx.resume().catch(() => {}), new Promise(r2 => setTimeout(r2, 250))]);
      openSink();
      announce(t);
    }
    const reader = r.body.getReader();
    let carry = null, nextAt = 0;
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      if (!value?.length) continue;
      if (t.ttfs == null) { t.ttfs = performance.now() - t0; updateTake(t); }
      chunks.push(value); bytes += value.length;
      let b = value;
      if (carry) {
        b = new Uint8Array(carry.length + value.length);
        b.set(carry); b.set(value, carry.length); carry = null;
      }
      const even = b.length & ~1;
      if (b.length > even) carry = b.slice(even);
      if (!even) continue;
      const a = b.slice(0, even);        // fresh buffer — aligned for Int16
      const i16 = new Int16Array(a.buffer, 0, even >> 1);
      const abuf = audioCtx.createBuffer(1, i16.length, rate);
      const ch = abuf.getChannelData(0);
      for (let i = 0; i < i16.length; i++) ch[i] = i16[i] / 32768;
      const src = audioCtx.createBufferSource();
      src.buffer = abuf;
      src.connect(sink || audioCtx.destination);
      const at = Math.max(audioCtx.currentTime, nextAt);   // seamless queue
      src.start(at);
      nextAt = at + abuf.duration;
      // The element stays playing until the last buffer has actually been heard —
      // the stream can run dry mid-sentence and pick up again, and that gap is not
      // the end. Only "no buffers left AND nothing more coming" is.
      t.live++;
      src.onended = () => { if (--t.live === 0 && t.over) closeSink(); };
      t.srcs.push(src);
    }
    t.gen = performance.now() - t0;
    finalizeStream(t, chunks, bytes, rate);
  } catch (err) {
    clearInterval(t.tick);
    if (err.name === 'AbortError') {
      t.gen = performance.now() - t0;
      if (bytes) finalizeStream(t, chunks, bytes, rate);   // keep what was heard
      else failTake(t, 0, 'stopped before any audio arrived');
    } else failTake(t, 0, String(err));
  }
}

function finalizeStream(t, chunks, bytes, rate) {
  clearInterval(t.tick);
  t.over = true;                       // nothing more is coming; the last buffer ends it
  if (!t.live) closeSink();            // …or it already did
  if (!bytes) return failTake(t, 0, '200 but no audio arrived — the stream was empty');
  t.url = URL.createObjectURL(pcmToWav(chunks, rate));
  t.dur = bytes / 2 / rate;
  t.state = 'done';
  attachAudio(t);      // the live take becomes a normal one — replayable
  updateTake(t);
}

function stopLive(t) {
  t.ac?.abort();                 // the engine stops synthesizing — the whole point
  audioCtx?.resume();            // stopped while paused: don't leave a frozen clock behind
  for (const s of t.srcs || []) { try { s.stop(); } catch {} }
  closeSink();
}

loadPhrases();
refreshEngines();
setInterval(refreshEngines, 2500);
</script>
