<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTS test bench</title>
<style>
  /* A listening room: warm near-black ground, one amber accent (the VU meter),
     green lamps for "live". All evidence — timings, sizes, ports — is mono. */
  :root {
    color-scheme: dark;
    --ground: #141110; --panel: #1c1815; --inset: #211c17; --line: #302a24;
    --text: #e9e2d6; --muted: #998f80; --faint: #6e6558;
    --signal: #e69f35; --lamp: #8fbf72; --fault: #d97b6c;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 system-ui, sans-serif; background: var(--ground); color: var(--text);
         max-width: 1260px; margin: 0 auto; padding: 1.6rem 1.2rem 3rem; }
  a { color: var(--signal); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  header { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap;
           border-bottom: 1px solid var(--line); padding-bottom: .9rem; margin-bottom: 1.2rem; }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 650; letter-spacing: .14em;
       text-transform: uppercase; }
  h1::before { content: ""; display: inline-block; width: .55em; height: .55em;
               background: var(--signal); border-radius: 1px; margin-right: .6em;
               vertical-align: baseline; }
  header .sub { color: var(--muted); font-size: .85rem; }

  h2 { font-size: .72rem; color: var(--muted); text-transform: uppercase;
       letter-spacing: .16em; font-weight: 600; margin: 1.6rem 0 .6rem; }
  .note { color: var(--muted); font-size: .8rem; }
  .err { color: var(--fault); font-size: .85rem; white-space: pre-wrap; }

  button { background: var(--inset); color: var(--text); border: 1px solid var(--line);
           border-radius: 5px; padding: .35rem .9rem; cursor: pointer; font: inherit; }
  button:hover { border-color: #4a4032; background: #262019; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--signal); border-color: var(--signal); color: #1c1300;
                   font-weight: 650; }
  button.primary:hover { background: #f0b155; border-color: #f0b155; }
  select, input[type=text], textarea { background: var(--inset); color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: .35rem .55rem; font: inherit; }
  textarea { width: 100%; min-height: 3.2em; }

  /* ── script: the phrase list ─────────────────────────────────────────── */
  .phrase { display: flex; gap: .6rem; align-items: baseline; padding: .38rem .55rem;
            border-radius: 5px; cursor: pointer; border: 1px solid transparent; }
  .phrase:hover { background: var(--panel); }
  .phrase.sel { background: var(--panel); border-color: var(--line); }
  .phrase.sel .tag { color: var(--signal); border-color: #574320; }
  .phrase .tag { font: .68rem/1.5 var(--mono); letter-spacing: .06em; color: var(--muted);
                 border: 1px solid var(--line); padding: .02rem .45rem; border-radius: 3px;
                 white-space: nowrap; }
  .phrase .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .phrase.sel .txt { white-space: normal; }
  .phrase .del { color: var(--faint); cursor: pointer; padding: 0 .3rem; background: none;
                 border: none; border-radius: 3px; }
  .phrase .del:hover { color: var(--fault); background: none; }

  /* ── channel select: engine chips ────────────────────────────────────── */
  .chips { display: flex; flex-wrap: wrap; gap: .45rem; }
  .echip { display: inline-flex; gap: .5rem; align-items: center; padding: .32rem .8rem;
           border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
           background: var(--panel); }
  .echip .note { font-family: var(--mono); font-size: .7rem; }
  .echip.on { border-color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal); }

  /* lamps — state must read from across the room */
  .lamp { width: 9px; height: 9px; border-radius: 50%; background: var(--faint);
          flex: none; display: inline-block; }
  .lamp.ready { background: var(--lamp); box-shadow: 0 0 6px 1px rgba(143,191,114,.55); }
  .lamp.loading { background: var(--signal); box-shadow: 0 0 6px 1px rgba(230,159,53,.55);
                  animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .lamp.loading { animation: none; } }

  /* ── transport bar ───────────────────────────────────────────────────── */
  .runbar { display: flex; gap: .6rem; align-items: center; margin: 1rem 0 1.2rem;
            position: sticky; top: 0; z-index: 3; padding: .6rem .8rem;
            background: rgba(20,17,16,.92); backdrop-filter: blur(6px);
            border: 1px solid var(--line); border-radius: 8px; }

  /* ── channel strips ──────────────────────────────────────────────────── */
  #cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
           gap: 1rem; align-items: start; }
  .card { display: flex; flex-direction: column; background: var(--panel);
          border: 1px solid var(--line); border-radius: 8px; padding: .85rem 1rem;
          min-width: 0; }
  .card.loading { border-color: #55421f; }
  .card h3 { order: 0; margin: 0; font-size: .95rem; display: flex; gap: .55rem;
             align-items: center; padding-bottom: .55rem; border-bottom: 1px solid var(--line); }
  .card h3 .st { font: .72rem/1.4 var(--mono); font-weight: 400; letter-spacing: .05em;
                 text-transform: uppercase; margin-left: auto; }
  .st.ready { color: var(--lamp); } .st.loading { color: var(--signal); }
  .st.stopped { color: var(--faint); }
  .card.stopped h3 { color: var(--muted); }
  .stdetail { font: .72rem/1.5 var(--mono); color: var(--signal); padding-top: .4rem; }
  .stdetail:empty { display: none; }
  /* the take outranks the knobs: results sit right under the nameplate */
  .card .stdetail { order: 1; }
  .card .results { order: 2; }
  .card .body { order: 3; padding-top: .35rem; }
  .row { display: flex; gap: .5rem; margin: .4rem 0; align-items: center; flex-wrap: wrap; }

  .knob { margin: .65rem 0; }
  .knob .kh { display: flex; justify-content: space-between; font-size: .84rem; }
  .knob .kh b { font-weight: 600; }
  .knob .kh .val { color: var(--signal); font-family: var(--mono); font-size: .8rem;
                   font-variant-numeric: tabular-nums; }
  /* knobs stay quiet — amber belongs to the take and the transport */
  .knob input[type=range] { width: 100%; accent-color: #7d6f57; }
  .knob .desc { color: var(--faint); font-size: .76rem; }

  /* ── the take: player first, then the evidence ───────────────────────── */
  .res { border-top: 1px solid var(--line); margin-top: .6rem; padding-top: .6rem; }
  .res .mode { font: .68rem/1.4 var(--mono); color: var(--muted); text-transform: uppercase;
               letter-spacing: .14em; }
  audio { width: 100%; height: 40px; margin: .45rem 0 .2rem; display: block; }
  .figs { display: flex; gap: 1.4rem; align-items: baseline; flex-wrap: wrap;
          font-variant-numeric: tabular-nums; margin-top: .3rem; }
  .fig .fv { font: 600 1.05rem/1.3 var(--mono); display: block; }
  .fig.first .fv { color: var(--signal); }
  .fig .fl { font-size: .68rem; color: var(--muted); text-transform: uppercase;
             letter-spacing: .1em; }
  .fig.dim .fv { font-weight: 400; font-size: .85rem; color: var(--muted); }
  .gap { color: var(--muted); font-size: .78rem; margin-top: .25rem; }
  .gap b { color: var(--signal); font-family: var(--mono); font-weight: 600; }

  /* a 4xx is the engine answering, not the page breaking */
  .refusal { border-left: 3px solid var(--line); padding: .15rem 0 .15rem .7rem;
             margin-top: .35rem; color: var(--muted); font-style: italic; }
  .refusal .who { display: block; font: normal .68rem/1.6 var(--mono); color: var(--faint);
                  text-transform: uppercase; letter-spacing: .12em; font-style: normal; }

  @media (max-width: 640px) {
    body { padding: .9rem .7rem 7.5rem; }
    #cards { grid-template-columns: 1fr; }
    .phrase .txt { white-space: normal; }
    button, select, input { min-height: 2.3rem; font-size: 1rem; }
    .runbar { position: fixed; left: .5rem; right: .5rem; bottom: .5rem; top: auto;
              margin: 0; flex-wrap: wrap; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
    .runbar .note { display: none; }
  }
</style>

<header>
  <h1>Test bench</h1>
  <span class="sub">side-by-side synthesis · <a href="/">machine panel</a></span>
</header>

<h2>Script</h2>
<div id="phrases"></div>
<div class="row" style="margin-top:.5rem">
  <textarea id="newphrase" placeholder="Type a new phrase — it joins the list and survives a restart"></textarea>
</div>
<div class="row"><button id="addphrase">add phrase</button><span class="note" id="phrasenote"></span></div>

<h2>Engines</h2>
<div class="chips" id="chips"></div>
<p class="note" id="gpunote"></p>

<div class="runbar">
  <button class="primary" id="run">▶ generate</button>
  <button class="primary" id="runstream">≋ generate (stream)</button>
  <button id="runboth">both</button>
  <span class="note">runs the selected phrase on every selected engine, side by side</span>
</div>

<div id="cards"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const ms = v => v == null ? '—' : v < 1000 ? Math.round(v) + ' ms' : (v/1000).toFixed(2) + ' s';

let phrases = [], phraseId = null;
let engines = [];                 // last /api/engines snapshot
const selected = new Set();       // engine names on the bench
const cards = {};                 // name -> {state, voices, params, values, results, flt}

/* ── phrases ─────────────────────────────────────────────────────────── */
async function loadPhrases() {
  phrases = (await (await fetch('/api/phrases')).json()).phrases;
  if (!phrases.find(p => p.id === phraseId)) phraseId = phrases[0]?.id ?? null;
  renderPhrases();
}
function renderPhrases() {
  $('phrases').replaceChildren(...phrases.map(p => {
    const div = document.createElement('div');
    div.className = 'phrase' + (p.id === phraseId ? ' sel' : '');
    div.innerHTML = `<span class="tag">${esc(p.label || 'custom')}</span>` +
      `<span class="txt">${esc(p.text)}</span><button class="del" title="delete">×</button>`;
    div.onclick = () => { phraseId = p.id; renderPhrases(); };
    div.querySelector('.del').onclick = async e => {
      e.stopPropagation();
      await fetch('/api/phrases/' + p.id, {method: 'DELETE'});
      loadPhrases();
    };
    return div;
  }));
}
$('addphrase').onclick = async () => {
  const text = $('newphrase').value.trim();
  if (!text) return;
  const r = await fetch('/api/phrases', {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text})});
  const j = await r.json();
  $('phrasenote').textContent = r.ok ? 'saved — persists across restarts' : (j.error || 'failed');
  if (r.ok) { $('newphrase').value = ''; phraseId = j.id; loadPhrases(); }
};

/* ── engines / cards ─────────────────────────────────────────────────── */
async function refreshEngines() {
  try { engines = await (await fetch('/api/engines')).json(); }
  catch { $('gpunote').textContent = 'console server unreachable'; return; }
  $('chips').replaceChildren(...engines.map(e => {
    const b = document.createElement('span');
    b.className = 'echip' + (selected.has(e.name) ? ' on' : '');
    b.innerHTML = `<span class="lamp ${e.state}"></span>${e.name}` +
      `<span class="note">${e.gpu}</span>`;
    b.onclick = () => {
      selected.has(e.name) ? (selected.delete(e.name), delete cards[e.name])
                           : selected.add(e.name);
      renderCards();
    };
    return b;
  }));
  const holder = engines.find(e => e.gpu === 'gpu' && e.state !== 'stopped');
  $('gpunote').textContent = holder
    ? `one 24 GB card, one GPU engine at a time — ${holder.name} is on the card now`
    : 'no GPU engine is on the card';
  renderCards();
}

function card(name) { return cards[name] ??= {results: {}, values: {}, flt: {lang: '', kind: ''}}; }

function renderCards() {
  const wrap = $('cards');
  // keep card DOM stable: create/remove only on selection change
  for (const el of [...wrap.children]) if (!selected.has(el.dataset.name)) el.remove();
  for (const name of selected) {
    let el = wrap.querySelector(`[data-name="${name}"]`);
    if (!el) {
      el = document.createElement('div');
      el.className = 'card'; el.dataset.name = name;
      el.innerHTML = `<h3><span class="lamp"></span>${esc(name)} <span class="st"></span></h3>
        <div class="stdetail"></div><div class="body"></div><div class="results"></div>`;
      wrap.appendChild(el);
    }
    updateCard(name, el);
  }
}

function updateCard(name, el) {
  const e = engines.find(x => x.name === name);
  const c = card(name);
  el.className = 'card ' + e.state;
  el.querySelector('.lamp').className = 'lamp ' + e.state;
  const st = el.querySelector('.st');
  st.className = 'st ' + e.state;
  st.textContent = e.state;
  el.querySelector('.stdetail').textContent =
    e.state === 'loading' && e.detail ? e.detail : '';
  const body = el.querySelector('.body');

  if (e.state === 'stopped') {
    c.loaded = false;
    body.innerHTML = `<div class="row"><span class="note">not running — that's not an error:</span>
      <button>start it</button></div>` + (e.error ? `<div class="err">${esc(e.error)}</div>` : '');
    body.querySelector('button').onclick = async () => {
      const r = await fetch(`/api/engines/${name}/up`, {method: 'POST'});
      const j = await r.json().catch(() => ({}));
      if (!r.ok) body.insertAdjacentHTML('beforeend', `<div class="err">${esc(j.error || 'up failed')}</div>`);
      refreshEngines();
    };
  } else if (e.state === 'loading') {
    c.loaded = false;
    body.innerHTML = `<span class="note">loading — the model is coming up, controls appear when it's ready</span>`;
  } else if (!c.loaded) {
    c.loaded = true;
    body.innerHTML = `<span class="note">fetching voices & params…</span>`;
    loadControls(name, body).catch(err => {
      c.loaded = false;
      body.innerHTML = `<div class="err">could not load controls: ${esc(String(err))}</div>`;
    });
  }
  // results are rendered only when a synthesis starts/ends — a 2s poll must
  // not rebuild <audio> elements mid-playback
}

async function loadControls(name, body) {
  const c = card(name);
  const [vr, pr] = await Promise.all([
    fetch(`/api/engines/${name}/voices`), fetch(`/api/engines/${name}/params`)]);
  if (!vr.ok || !pr.ok) throw new Error(`voices ${vr.status} / params ${pr.status}`);
  c.voices = (await vr.json()).voices;
  c.params = (await pr.json()).params;
  c.values = {};   // only knobs the user touched get sent

  const langs = [...new Set(c.voices.flatMap(v => v.langs))].sort();
  body.innerHTML = `
    <div class="row">
      <select class="flang"><option value="">any lang</option>
        ${langs.map(l => `<option>${l}</option>`).join('')}</select>
      <select class="fkind"><option value="">builtin + reference</option>
        <option value="builtin">builtin (the model's own)</option>
        <option value="reference">reference (cloning clips)</option></select>
      <span class="note vcount"></span>
    </div>
    <div class="row"><select class="voice" style="max-width:100%"></select></div>
    <div class="knobs"></div>`;

  const voiceSel = body.querySelector('.voice');
  const fill = () => {
    const {lang, kind} = c.flt;
    const vs = c.voices.filter(v => (!lang || v.langs.includes(lang)) && (!kind || v.kind === kind));
    voiceSel.replaceChildren(
      new Option('(engine default voice)', ''),
      ...vs.map(v => new Option(
        `${v.name} — ${v.kind}${v.origin ? ' from ' + v.origin : ''} · ${v.langs.join(',')} · ${v.gender}`,
        v.id)));
    body.querySelector('.vcount').textContent = `${vs.length} of ${c.voices.length} voices`;
  };
  body.querySelector('.flang').onchange = ev => { c.flt.lang = ev.target.value; fill(); };
  body.querySelector('.fkind').onchange = ev => { c.flt.kind = ev.target.value; fill(); };
  fill();

  // one control per knob, straight from /v1/params — nothing hardcoded
  const knobs = body.querySelector('.knobs');
  const entries = Object.entries(c.params);
  if (!entries.length)
    knobs.innerHTML = `<div class="note">this engine declares no knobs — {"params": {}} is a real answer</div>`;
  for (const [k, p] of entries) {
    const div = document.createElement('div');
    div.className = 'knob';
    if (p.type === 'number' || p.type === 'integer') {
      div.innerHTML = `<div class="kh"><b>${esc(k)}</b><span class="val">${p.default}</span></div>
        <input type="range" min="${p.min}" max="${p.max}" value="${p.default}"
               step="${p.type === 'integer' ? 1 : Math.pow(10, Math.floor(Math.log10((p.max - p.min) / 100)))}">
        <div class="desc">${esc(p.description)} (${p.min}–${p.max}, default ${p.default})</div>`;
      div.querySelector('input').oninput = ev => {
        const v = p.type === 'integer' ? parseInt(ev.target.value) : parseFloat(ev.target.value);
        div.querySelector('.val').textContent = v;
        v === p.default ? delete c.values[k] : c.values[k] = v;
      };
    } else if (p.type === 'boolean') {
      div.innerHTML = `<div class="kh"><b><label><input type="checkbox" ${p.default ? 'checked' : ''}> ${esc(k)}</label></b></div>
        <div class="desc">${esc(p.description)} (default ${p.default})</div>`;
      div.querySelector('input').onchange = ev =>
        ev.target.checked === p.default ? delete c.values[k] : c.values[k] = ev.target.checked;
    } else {
      div.innerHTML = `<div class="kh"><b>${esc(k)}</b></div>
        <input type="text" value="${esc(String(p.default))}" style="width:100%">
        <div class="desc">${esc(p.description)} (default ${esc(String(p.default))})</div>`;
      div.querySelector('input').oninput = ev =>
        ev.target.value === String(p.default) ? delete c.values[k] : c.values[k] = ev.target.value;
    }
    knobs.appendChild(div);
  }
}

/* ── synthesis ───────────────────────────────────────────────────────── */
function pcmToWav(chunks, rate) {
  const len = chunks.reduce((a, c) => a + c.length, 0);
  const buf = new ArrayBuffer(44 + len), v = new DataView(buf), u = new Uint8Array(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + len, true); w(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, len, true);
  let o = 44; for (const c of chunks) { u.set(c, o); o += c.length; }
  return new Blob([buf], {type: 'audio/wav'});
}

async function speak(name, mode) {
  const c = card(name);
  const el = document.querySelector(`[data-name="${name}"]`);
  const voice = el?.querySelector('.voice')?.value || null;
  const phrase = phrases.find(p => p.id === phraseId);
  const body = {input: phrase.text, stream: mode === 'stream'};
  if (voice) body.voice = voice;
  if (Object.keys(c.values).length) body.params = {...c.values};

  const res = c.results[mode] = {running: true};
  renderResults(name, el.querySelector('.results'));
  const t0 = performance.now();
  try {
    const r = await fetch(`/api/engines/${name}/speech`, {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    if (!r.ok) {
      const txt = await r.text();
      let msg; try { msg = JSON.parse(txt).detail || JSON.parse(txt).error; } catch { msg = txt; }
      Object.assign(res, {running: false, status: r.status, error: msg || ('HTTP ' + r.status)});
      return;
    }
    const rate = parseInt(r.headers.get('x-sample-rate') || '0');
    const reader = r.body.getReader();
    const chunks = []; let first = null;
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      if (value?.length) { first ??= performance.now(); chunks.push(value); }
    }
    const total = performance.now() - t0;
    const bytes = chunks.reduce((a, c) => a + c.length, 0);
    if (!bytes) {
      Object.assign(res, {running: false, error: '200 but the body was empty — the engine produced no audio'});
      return;
    }
    const blob = mode === 'stream' ? pcmToWav(chunks, rate || 24000)
                                   : new Blob(chunks, {type: r.headers.get('Content-Type') || 'audio/wav'});
    Object.assign(res, {running: false, ttfa: first - t0, total,
                        url: URL.createObjectURL(blob), bytes});
  } catch (err) {
    Object.assign(res, {running: false, error: String(err)});
  } finally {
    renderResults(name, el.querySelector('.results'));
  }
}

function renderResults(name, box) {
  const c = cards[name];
  if (!c || !box) return;
  box.replaceChildren(...['normal', 'stream'].map(mode => {
    const r = c.results[mode];
    if (!r) return '';
    const div = document.createElement('div');
    div.className = 'res';
    if (r.running) {
      div.innerHTML = `<span class="mode">${mode}</span> <span class="note">synthesizing…</span>`;
    } else if (r.error) {
      // a 4xx carries a sentence the engine meant to say; only transport
      // failures and 5xx get the red treatment
      div.innerHTML = r.status && r.status < 500
        ? `<span class="mode">${mode}</span>
           <div class="refusal"><span class="who">the engine declined · ${r.status}</span>${esc(r.error)}</div>`
        : `<span class="mode">${mode}</span>
           <div class="err">${r.status ? r.status + ': ' : ''}${esc(r.error)}</div>`;
    } else {
      div.innerHTML = `<span class="mode">${mode}</span>
        <audio controls src="${r.url}"></audio>
        <div class="figs">
          <div class="fig first"><span class="fv">${ms(r.ttfa)}</span><span class="fl">first audio</span></div>
          <div class="fig"><span class="fv">${ms(r.total)}</span><span class="fl">total</span></div>
          <div class="fig dim"><span class="fv">${(r.bytes / 1024).toFixed(0)} KiB</span></div>
        </div>
        ${mode === 'stream' && c.results.normal?.total
          ? `<div class="gap">vs <b>${ms(c.results.normal.total)}</b> before any sound without streaming</div>` : ''}`;
    }
    return div;
  }).filter(Boolean));
}

function runAll(modes) {
  if (phraseId == null) return;
  for (const name of selected) {
    const e = engines.find(x => x.name === name);
    if (e?.state !== 'ready') {
      card(name).results.normal = {error: `${name} is not ready — start it on its card first`, running: false};
      renderResults(name, document.querySelector(`[data-name="${name}"] .results`));
      continue;
    }
    // modes run in sequence per engine — two simultaneous syntheses on one
    // engine skew both timings (and some engines refuse concurrency outright);
    // engines still run side by side
    (async () => { for (const m of modes) await speak(name, m); })();
  }
}
$('run').onclick = () => runAll(['normal']);
$('runstream').onclick = () => runAll(['stream']);
$('runboth').onclick = () => runAll(['normal', 'stream']);

loadPhrases();
refreshEngines();
setInterval(refreshEngines, 2000);
</script>
